<h2>My Breweries</h2>

<a matButton="outlined" class="add-link" routerLink="/add">Add a brewery</a>
<p class="note">Changes are saved on this device only.</p>

@if (rows().length) {
  <!-- matSortChange fires when a header is clicked. rows() re-sorts from the new value. -->
  <table mat-table [dataSource]="rows()" matSort (matSortChange)="sort.set($event)"
         matSortActive="name" matSortDirection="asc">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let b">{{ b.name }}</td>
    </ng-container>

    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>City</th>
      <td mat-cell *matCellDef="let b">{{ b.city }}</td>
    </ng-container>

    <ng-container matColumnDef="brewery_type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
      <td mat-cell *matCellDef="let b">{{ b.brewery_type | breweryType }}</td>
    </ng-container>

    <!-- No mat-sort-header here, so this column cannot be sorted. -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let b">
        <a matButton [routerLink]="['/edit', b.id]">Edit</a>
        <button matButton type="button" appConfirm="Delete this brewery?" (confirmed)="remove(b.id)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" appHighlight="var(--mat-sys-surface-container-high)"></tr>
  </table>
} @else {
  <p>You have not added any breweries yet.</p>
}
