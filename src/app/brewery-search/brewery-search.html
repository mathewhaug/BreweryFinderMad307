<h2>Search breweries</h2>

<div class="search-bar">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Search term</mat-label>
    <input matInput #term appAutoFocus placeholder="Name, city, or keyword" (keyup.enter)="runSearch(term.value)" />
  </mat-form-field>
  <button matButton="filled" type="button" (click)="runSearch(term.value)">Search</button>
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  @for (b of results(); track b.id) {
    <app-brewery-card [brewery]="b" />
  } @empty {
    <p>No results yet. Enter a search term above.</p>
  }
}
