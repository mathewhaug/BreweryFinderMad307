<h2>Search breweries</h2>

<div class="search-bar">
  <input #term placeholder="Name, city, or keyword" aria-label="Search term" (keyup.enter)="runSearch(term.value)" />
  <button type="button" (click)="runSearch(term.value)">Search</button>
</div>

@if (loading()) {
  <p>Searching...</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  @for (b of results(); track b.id) {
    <app-brewery-card [brewery]="b" />
  } @empty {
    <p>No results yet. Enter a search term above.</p>
  }
}
