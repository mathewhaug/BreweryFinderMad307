<mat-sidenav-container class="app-shell">
  <!-- mode="over" slides the drawer over the page with a backdrop. Clicking a link closes it. -->
  <mat-sidenav #drawer mode="over">
    <mat-nav-list (click)="drawer.close()">
      @for (link of links(); track link.path) {
        <a mat-list-item
           [routerLink]="link.path"
           routerLinkActive="active"
           #rla="routerLinkActive"
           [routerLinkActiveOptions]="{ exact: link.exact }"
           [activated]="rla.isActive">{{ link.label }}</a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      @if (isHandset()) {
        <button matIconButton type="button" aria-label="Open menu" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span>{{ title }}</span>
      <span class="spacer"></span>
      @if (!isHandset()) {
        @for (link of links(); track link.path) {
          <a matButton
             [routerLink]="link.path"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: link.exact }">{{ link.label }}</a>
        }
      }
    </mat-toolbar>

    <!-- The page for the matched route is displayed here. -->
    <main class="container">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
