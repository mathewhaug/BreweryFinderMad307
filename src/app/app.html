<div class="container">
  <h2>Brewery List</h2>

  @for (brewery of breweryList; track brewery.id) {
    <div class="brewery-card">
      <h3>{{ brewery.name }}</h3>
      <p>{{ brewery.city }}</p>
      <p>{{ brewery.breweryType }}</p>
      <p>Food menu: {{ brewery.hasFoodMenu ? 'Yes' : 'No' }}</p>
      <button class="toggle-button" (click)="toggleFoodMenu(brewery)">Toggle Food Menu</button>
    </div>
  }
</div>
