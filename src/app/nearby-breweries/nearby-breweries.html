<section class="nearby">
  <h3>Nearby breweries</h3>

  @if (breweries.isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else {
    <ul>
      @for (b of nearby(); track b.id) {
        <li>
          <a [routerLink]="['/breweries', b.id]">{{ b.name }}</a>
          {{ b.brewery_type }}
        </li>
      } @empty {
        <li>No other breweries found in {{ city() }}.</li>
      }
    </ul>
  }
</section>
